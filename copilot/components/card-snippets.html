<!-- Canonical pricing card / tier patterns -->

<article class="pricing-card card" data-tier="starter">
  <h2 class="tier-name">Starter</h2>
  <p class="tier-price">
    <span class="price-amount" data-monthly="19" data-annual="15">$19</span>
    <span class="price-period">/month</span>
  </p>
  <ul class="tier-features">
    <li>Feature one</li>
  </ul>
  <button type="button" class="btn cta">Get Starter</button>
</article>

<article class="pricing-card card pricing-card--popular" data-tier="pro">
  <span class="badge badge-popular">Most popular</span>
  <h2 class="tier-name">Pro</h2>
  <!-- … -->
  <button type="button" class="btn btn--primary cta">Get Pro</button>
</article>

<!--
Class checklist:
- card / pricing-card
- tier-name, tier-price, tier-features (tier*)
- badge / badge-popular
- pricing-card--popular on recommended plan
-->
